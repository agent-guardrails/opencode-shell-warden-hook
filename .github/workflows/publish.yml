# Publishes the package to npm under the @agent-guardrails org scope.
# Trigger: publishing a GitHub Release (tag vX.Y.Z) — the same tag the
# AI Release Notes workflow already consumes. Package.json version must match the tag.
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC trusted publishing: npm authenticates via short-lived
                       # GitHub token matching the Trusted Publisher configured at
                       # npmjs.com/package/@agent-guardrails/opencode-shell-warden-hook/access
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package version
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.RELEASE_TAG;
            const expected = tag.replace(/^v/, "");
            if (pkg.version !== expected) {
              console.error(`Tag ${tag} does not match package.json version ${pkg.version}`);
              process.exit(1);
            }
            console.log(`Publishing ${pkg.name}@${pkg.version}`);
          '
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}

      - run: npm install -g npm@latest  # trusted publishing requires npm >= 11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - run: npm publish --provenance  # OIDC auth — no NPM_TOKEN needed
